<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta</title>

    <link rel="icon" type="image/x-icon" href="/assets/images/Logo Mabel 1.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../styles/globals.css">
    <link rel="stylesheet" href="../cadastro/cadastro.css">
</head>
<body>

    <nav class="navbar">
        <a href="../../index.html" class="logo">
            <img src="../../assets/images/logo-laranja.png" alt="Logo Mabel" class="logo">
        </a>

        <button class="theme-toggle" id="theme-toggle" aria-label="Alternar modo escuro">
            <span class="theme-icon" id="theme-icon">☾</span>
        </button>

        <button class="hamburger-btn" id="hamburger-btn" aria-label="Abrir Menu">
            <img src="../../assets/images/HAMBURGUER.png" alt="Ícone de menu" class="hamburger-icon">
        </button>

        <ul class="nav-links" id="nav-links">
            
            <li class="user-card-item">
                <a href="../login/login.html" class="user-card-link">
                    <div class="user-card">
                        <div class="user-info">
                            <img src="../../assets/images/foto-de-perfil.png" alt="Marisa Ferreira" class="user-avatar">
                            <span class="user-name">Marisa Ferreira</span>
                        </div>
                        <button type="button" class="notification-btn" aria-label="Notificações">
                            <img src="../../assets/images/ICON LEMBRETE.png" alt="Notificação" class="notification-icon">
                        </button>
                    </div>
                </a>
            </li>

            <li>
                <a href="../login/login.html">
                    <img src="../../assets/images/ICON ORTESE.png" alt="" class="nav-item-icon">
                    <span>Órtese</span>
                </a>
            </li>
            <li>
                <a href="../instrucoes/instrucoes.html">
                    <img src="../../assets/images/instruções icon.png" alt="" class="nav-item-icon">
                    <span>Instruções</span>
                </a>
            </li>
            <li>
                <a href="../produto/produto.html">
                    <img src="../../assets/images/produto icon.png" alt="" class="nav-item-icon">
                    <span>Produto</span>
                </a>
            </li>
            <li>
                <a href="../equipe/equipe.html">
                    <img src="../../assets/images/equipe icon.png" alt="" class="nav-item-icon">
                    <span>Equipe</span>
                </a>
            </li>
            <li>
                <a href="../referencias/referencias.html">
                    <img src="../../assets/images/referencias icon.png" alt="" class="nav-item-icon">
                    <span>Referências</span>
                </a>
            </li>
            <li>
                <a href="../jogo/jogo.html">
                    <img src="../../assets/images/jogo icon.png" alt="" class="nav-item-icon">
                    <span>Jogo</span>
                </a>
            </li>
        </ul>
        
        <div class="nav-actions">
            <a href="../login/login.html" class="profile">
                <img src="../../assets/images/foto-de-perfil.png" alt="foto-de-perfil" class="profile">
            </a>
        </div>
    </nav>

    <div class="menu-overlay" id="menu-overlay"></div>

    <main class="main-container">
        <section class="left-section">
            <div class="headline-container">
                <h1>Mais estabilidade, conforto e qualidade de vida.</h1>
                <p class="subtitle">
                    Porque cada movimento importa.
                    <span class="paw-icon">🐾</span>
                </p>
            </div>

            <div class="dog-image-container">
                <img src="/assets/images/lulu login mobile.png" alt="" class="dog-image-mobile">
                <img src="../../assets/images/lulu login.png" alt="Cão da raça Spitz Alemão utilizando órtese no pata" class="dog-image">
            </div>
        </section>

        <section class="right-section">
            <div class="register-card">
                <h2>Criar Conta</h2>

            <form class="register-form" action="/software/home/home.html" method="GET">
            <div class="input-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>
            </div>

            <button type="submit" class="submit-btn">Criar Conta</button>
        </form>

                <p class="login-footer">
                    Já tem uma conta? <a href="../login/login.html">LOGIN</a>
                </p>
            </div>
        </section>
    </main>

    <script src="../../js/script.js"></script>

</body>
</html>
